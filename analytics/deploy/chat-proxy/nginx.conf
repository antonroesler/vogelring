# Reverse proxy in front of LibreChat so the Analyse-App (analytics.vogelring.com) can embed the chat in a drawer.
# LibreChat sends `X-Frame-Options: SAMEORIGIN`; this proxy replaces it with a CSP that allows exactly our hosts.
# cloudflared keeps pointing chat.vogelring.com -> localhost:3080; this container now owns that port.
server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    location / {
        proxy_pass http://librechat:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;          # SSE streaming of answers
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' https://analytics.vogelring.com https://charts.vogelring.com" always;
    }
}
