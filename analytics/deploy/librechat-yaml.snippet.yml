# Merge into /mnt/ssd/apps/librechat/librechat.yaml (LibreChat v0.8.8+).
# Internal MCP destinations must be allowlisted since v0.8.8.
mcpSettings:
  allowedAddresses:
    - "analytics-mcp:8000"

mcpServers:
  vogelring-analytics:
    type: streamable-http
    url: http://analytics-mcp:8000/mcp
    timeout: 300000
    serverInstructions: true

# Memory: the chat remembers user preferences and explanations across conversations.
# The memory agent runs on the ChatGPT subscription endpoint.
memory:
  disabled: false
  personalize: true
  tokenLimit: 4000
  messageWindowSize: 6
  validKeys:
    - begriffe          # what the user means by a term (Nordufer, Kerngruppe, …)
    - vorlieben         # colours, chart styles, report length, language
    - projekte          # ongoing analyses, questions the user cares about
    - orte              # places the user observes regularly
    - person            # name, role, how they want to be addressed
  agent:
    provider: "ChatGPT"
    model: "gpt-6-luna"
    instructions: >
      Du verwaltest das Langzeitgedächtnis für Vogelring-Nutzer (Vogelkundler). Speichere nur dauerhaft Nützliches:
      begriffe (was der Nutzer mit einem Begriff meint), vorlieben (Darstellung, Berichtsform, Farben),
      projekte (laufende Fragestellungen), orte (regelmäßig beobachtete Orte), person (Name, Rolle, Anrede).
      Fasse knapp auf Deutsch zusammen, überschreibe veraltete Einträge, speichere keine einzelnen Zahlen oder Zwischenergebnisse.

interface:
  schedules:
    use: true
    create: true
    maxPerUser: 20
    minIntervalMinutes: 60
    autoDisableAfterFailures: 5
  artifactUndocking: true

endpoints:
  agents:
    capabilities:
      - "tools"
      - "actions"
      - "artifacts"
      - "ask_user_question"
      - "memory"
      - "skills"
      - "subagents"
      - "deferred_tools"
      - "context"
      - "file_search"
    recursionLimit: 75
    maxRecursionLimit: 120
    maxSubagents: 6

# Single-purpose chat: the picker shows only the Vogelring agent; no endpoint/model menus, no agent builder.
# The ChatGPT custom endpoint (LiteLLM, Codex OAuth) stays configured as the agent's backend, with
# gpt-6.1-sol for the agent and gpt-6-luna for titles/memory. DeepSeek and Claude endpoints were removed (2026-10-24).
interface:
  endpointsMenu: false
  modelSelect: false
  parameters: false
  presets: false

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "vogelring"
      label: "Vogelring"
      default: true
      description: "Auswertungen, Karten, Berichte und Präsentationen aus der Vogelring-Datenbank"
      showIconInHeader: true
      preset:
        endpoint: "agents"
        agent_id: "agent_jhKSvfDXizwVf0IHVWwjY"

endpoints:
  agents:
    disableBuilder: true
