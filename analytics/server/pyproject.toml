[project]
name = "vogelring-analytics-mcp"
version = "0.1.0"
description = "Vogelring analytics MCP server: SQL datasets, charts, maps and exports for LibreChat"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "starlette>=0.45",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "playwright>=1.58",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "httpx>=0.28",
    "markdown>=3.7",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "markdown>=3.7",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vogelring_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
